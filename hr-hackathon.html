<!DOCTYPE html>
<html lang="nl" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HR Hackathon, 2 februari 2027 | Recruit AI Live</title>
    <meta name="description" content="Bouw in één dag je eigen HR-applicatie met vibe coding. Voor HR- en corporate recruitmentprofessionals. Dinsdag 2 februari 2027, Utrecht." />
    <link rel="icon" type="image/png" href="https://media-01.imu.nl/storage/klikwork.com/32015/ral-favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              display: ['"Bricolage Grotesque"', 'Inter', 'system-ui', 'sans-serif'],
            },
            colors: {
              ink: '#05070d',
            },
          },
        },
      }
    </script>
    <style>
      body { background-color: #05070d; color: #e2e8f0; }
      h1, h2, h3 { font-family: 'Bricolage Grotesque', Inter, system-ui, sans-serif; letter-spacing: -0.02em; }
      ::selection { background: #38bdf8; color: #05070d; }
      :focus-visible { outline: 2px solid #38bdf8; outline-offset: 3px; border-radius: 6px; }
      html { scrollbar-color: #334155 #05070d; }
      a { text-underline-offset: 3px; }
      p, li, h1, h2, h3 { text-wrap: pretty; }
      h1, h2 { text-wrap: balance; }

      /* ---------- Motion ---------- */
      /* Hero light */
      .aurora { position: absolute; inset: -10% 0 0 0; overflow: hidden; pointer-events: none; z-index: 0; }
      .aurora-blob { position: absolute; border-radius: 9999px; filter: blur(80px); opacity: .55; will-change: transform; }
      .aurora-a { width: 46vw; height: 46vw; max-width: 640px; max-height: 640px; left: -8%; top: -12%; background: radial-gradient(circle, rgba(56,189,248,.55), transparent 65%); animation: drift-a 18s ease-in-out infinite alternate; }
      .aurora-b { width: 40vw; height: 40vw; max-width: 560px; max-height: 560px; right: -6%; top: 6%; background: radial-gradient(circle, rgba(129,140,248,.45), transparent 65%); animation: drift-b 22s ease-in-out infinite alternate; }
      .aurora-c { width: 30vw; height: 30vw; max-width: 420px; max-height: 420px; left: 35%; top: 40%; background: radial-gradient(circle, rgba(45,212,191,.28), transparent 65%); animation: drift-c 26s ease-in-out infinite alternate; }
      .aurora-grid { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.09) 1px, transparent 1px); background-size: 28px 28px; mask-image: radial-gradient(ellipse 70% 60% at 50% 30%, #000 30%, transparent 80%); -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 30%, #000 30%, transparent 80%); }
      @keyframes drift-a { to { transform: translate3d(12%, 10%, 0) scale(1.1); } }
      @keyframes drift-b { to { transform: translate3d(-14%, 12%, 0) scale(.92); } }
      @keyframes drift-c { to { transform: translate3d(-18%, -16%, 0) scale(1.15); } }

      /* Headline words */
      .word-mask { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .08em; margin-bottom: -.08em; }
      .word-rise { display: inline-block; transform: translateY(105%); animation: rise .9s cubic-bezier(.2,.8,.2,1) forwards; }
      @keyframes rise { to { transform: translateY(0); } }
      .text-gradient { background: linear-gradient(100deg, #7dd3fc 0%, #a5b4fc 35%, #5eead4 65%, #7dd3fc 100%); background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: rise .9s cubic-bezier(.2,.8,.2,1) forwards, sheen 7s linear 1.4s infinite; }
      @keyframes sheen { to { background-position: -220% 0; } }

      /* Load-in for hero blocks */
      .fade-in { opacity: 0; transform: translateY(14px); filter: blur(6px); animation: fadein .9s cubic-bezier(.2,.8,.2,1) forwards; }
      @keyframes fadein { to { opacity: 1; transform: none; filter: none; } }

      /* Scroll reveals */
      .reveal { opacity: 0; transition: opacity .8s cubic-bezier(.2,.8,.2,1), transform .8s cubic-bezier(.2,.8,.2,1), filter .8s; }
      .reveal-up { transform: translateY(24px); filter: blur(4px); }
      .reveal-zoom { transform: scale(.96); }
      .reveal.is-in { opacity: 1; transform: none; filter: none; }

      /* Floating hero photos */
      .float-slow { animation: float 9s ease-in-out infinite; }
      .float-slower { animation: float 11s ease-in-out -4s infinite; }
      @keyframes float { 50% { transform: translateY(-10px); } }

      /* Prompt card */
      .prompt-card { background: rgba(10,14,26,.72); border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-radius: 16px; padding: 14px 16px; box-shadow: 0 20px 50px -20px rgba(0,0,0,.8), 0 0 0 1px rgba(56,189,248,.08) inset; }
      .caret { display: inline-block; width: 2px; height: 1em; margin-left: 2px; vertical-align: -2px; background: #38bdf8; animation: blink 1s steps(2) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .app-build { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.08); opacity: .25; transition: opacity .4s; }
      .app-build.is-done { opacity: 1; }
      .build-bar { display: block; height: 6px; border-radius: 9999px; background: linear-gradient(90deg, rgba(56,189,248,.5), rgba(129,140,248,.4)); transform-origin: left; transform: scaleX(0); transition: transform .6s cubic-bezier(.2,.8,.2,1); }
      .app-build.is-done .build-bar { transform: scaleX(1); }
      .app-build.is-done .build-bar:nth-child(2) { transition-delay: .12s; }
      .app-build.is-done .build-bar:nth-child(3) { transition-delay: .24s; }

      /* Pointer spotlight */
      .spotlight { position: relative; isolation: isolate; }
      .spotlight::before { content: ''; position: absolute; inset: 0; border-radius: inherit; z-index: -1; opacity: 0; transition: opacity .3s; background: radial-gradient(320px circle at var(--x, 50%) var(--y, 50%), rgba(56,189,248,.12), transparent 70%); }
      .spotlight:hover::before { opacity: 1; }
      .lift { transition: transform .35s cubic-bezier(.2,.8,.2,1), border-color .35s, background-color .35s; }
      .lift:hover { transform: translateY(-3px); border-color: rgba(56,189,248,.35); }

      /* Timeline that fills while scrolling */
      .timeline { position: relative; --p: 0; }
      .timeline::before, .timeline::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 1px; }
      .timeline::before { background: rgba(255,255,255,.12); }
      .timeline::after { background: linear-gradient(#38bdf8, #818cf8); transform-origin: top; transform: scaleY(var(--p)); }
      .timeline .dot { transition: background-color .4s, box-shadow .4s; }
      .timeline .is-in .dot { background: #38bdf8; box-shadow: 0 0 0 6px rgba(56,189,248,.15); }

      /* Rotating border on the price card */
      @property --angle { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
      .glow-border { position: relative; border: 1px solid transparent; background: linear-gradient(#071019, #071019) padding-box, conic-gradient(from var(--angle), rgba(56,189,248,.15), #38bdf8, #818cf8, rgba(56,189,248,.15) 40%) border-box; animation: spin-border 6s linear infinite; }
      @keyframes spin-border { to { --angle: 360deg; } }

      /* Button shine */
      .btn-shine { position: relative; overflow: hidden; transition: transform .25s, box-shadow .25s, background-color .2s; }
      .btn-shine::after { content: ''; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.55) 50%, transparent 70%); transform: translateX(-120%); }
      .btn-shine:hover { transform: translateY(-1px); box-shadow: 0 10px 30px -8px rgba(56,189,248,.55); }
      .btn-shine:hover::after { transform: translateX(120%); transition: transform .7s ease; }

      /* Pulsing "live" dot */
      .pulse-dot { position: relative; }
      .pulse-dot::after { content: ''; position: absolute; inset: 0; border-radius: 9999px; background: inherit; animation: ping 2s cubic-bezier(0,0,.2,1) infinite; }
      @keyframes ping { 75%, 100% { transform: scale(2.4); opacity: 0; } }

      /* Sticky nav active marker */
      .nav-link { position: relative; transition: color .2s; }
      .nav-link::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; border-radius: 2px; background: #38bdf8; transform: scaleX(0); transition: transform .35s cubic-bezier(.2,.8,.2,1); }
      .nav-link.is-active { color: #fff; }
      .nav-link.is-active::after { transform: scaleX(1); }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
        .word-rise { transform: none; }
        .fade-in, .reveal { opacity: 1; transform: none; filter: none; }
        .build-bar { transform: none; }
      }
    </style>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/hr-hackathon.tsx"></script>
  </body>
</html>
